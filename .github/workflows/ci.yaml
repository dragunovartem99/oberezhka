name: CI
on:
  pull_request:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: make check
      - name: Check production configuration
        env:
          DJANGO_SECRET_KEY: ci-only-configuration-check-key-with-more-than-fifty-characters
          DJANGO_ALLOWED_HOSTS: oberezhka.dragunov.dev
          DJANGO_CSRF_TRUSTED_ORIGINS: https://oberezhka.dragunov.dev
        run: uv run python manage.py check --deploy --fail-level WARNING
      - run: DJANGO_DEBUG=1 uv run python manage.py makemigrations --check --dry-run
